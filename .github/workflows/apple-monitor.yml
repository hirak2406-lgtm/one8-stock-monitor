name: iphone18 christiana monitor

# Watches iPhone 18 Pro Max 256GB Burgundy (unlocked, MJW64LL/A) for in-store PICKUP at
# Apple Christiana Mall, Newark DE (store R102). Alerts via Telegram + loud Pushover.
# Free: this repo is public, so Actions minutes are unlimited.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apple-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Apple pickup availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          # To change model/store, override these (defaults = Pro Max 256GB Burgundy @ Christiana):
          # APPLE_PART: "MJW64LL/A"
          # APPLE_LOCATION: "19702"
          # APPLE_STORE: "R102"
        run: python3 apple_monitor.py

      - name: Persist state (only if it changed)
        run: |
          if [ -n "$(git status --porcelain apple_state.json)" ]; then
            git config user.name "stock-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add apple_state.json
            git commit -m "chore: update apple pickup state [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No state change to commit."
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="⚠️ iPhone 18 Christiana monitor FAILED
          A check errored (Apple may have changed the API / blocked). Logs: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null || true
