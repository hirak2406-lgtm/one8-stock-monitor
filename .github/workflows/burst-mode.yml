name: one8 burst mode (drop window)

# High-frequency polling for a known drop window — checks every ~20 seconds instead of the
# regular 5 minutes, so a fast restock is caught within seconds. Meant to run only around the
# announced drop time; the regular 5-min monitor keeps running the rest of the time.
#
# TIMEZONE: GitHub cron is in UTC. India is IST = UTC+5:30. Convert the IST drop time to UTC
# for the schedule below (subtract 5h30m). Examples for the Aug 18 2026 drop:
#   12:00 IST  -> 06:30 UTC  -> cron "30 6 18 8 *"
#   18:00 IST  -> 12:30 UTC  -> cron "0 12 18 8 *" (30 min earlier: "30 11 18 8 *")
#   00:00 IST (midnight, start of 18th) -> 18:30 UTC on the 17th -> "30 18 17 8 *"
# We start the burst ~15 min BEFORE the drop and it runs ~1 hour.

on:
  workflow_dispatch: {}          # arm manually any time from the Actions tab
  # schedule:                    # <-- uncomment + set once the exact IST drop time is known
  #   - cron: "MIN HR 18 8 *"    #     (UTC; e.g. 15 min before the drop)

permissions:
  contents: write

concurrency:
  group: stock-monitor           # SAME group as the 5-min monitor: they never run at once,
  cancel-in-progress: false      # so no double-alerts and no push races during the burst


jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rapid poll (~every 20s for ~55 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          for i in $(seq 1 165); do
            echo "--- burst check $i/165 ---"
            python3 monitor.py || true
            sleep 20
          done

      - name: Persist state (only if it changed)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "stock-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: burst-mode state update [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No state change to commit."
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="⚠️ one8 BURST mode failed
          The drop-window rapid poll errored. The regular 5-min monitor is still running.
          Logs: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null || true
