name: one8 burst mode (drop window)

# Blankets the WHOLE of Aug 18 2026 IST with ~20-second checks, since the exact drop time
# is unknown. Runs hourly ~53-min bursts back-to-back; the regular 5-min monitor covers the
# tiny gaps between bursts and the rest of the calendar.
#
# TIMEZONE: GitHub cron is UTC; India is IST = UTC+5:30. Aug 18 IST (00:00–24:00) maps to
# Aug 17 18:30 UTC → Aug 18 18:30 UTC. We add a ~1h buffer on each side to be safe.
#   Aug 17 17:30–23:30 UTC  = Aug 17 23:00 IST → Aug 18 05:00 IST
#   Aug 18 00:30–19:30 UTC  = Aug 18 06:00 IST → Aug 19 01:00 IST
# Auto-removes itself after the 18th (dates are hard-coded), so it won't burn runners later.

on:
  workflow_dispatch: {}          # arm/stop manually any time
  schedule:
    - cron: "30 17-23 17 8 *"    # Aug 17 (UTC) 17:30–23:30, hourly
    - cron: "30 0-19 18 8 *"     # Aug 18 (UTC) 00:30–19:30, hourly

permissions:
  contents: write

concurrency:
  group: stock-monitor           # SAME group as the 5-min monitor: never run at once,
  cancel-in-progress: false      # so no double-alerts and no push races

jobs:
  burst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rapid poll (~every 20s for ~53 min)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHAT_WEBHOOK_URL: ${{ secrets.CHAT_WEBHOOK_URL }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          END=$(( $(date +%s) + 53*60 ))
          i=0
          while [ "$(date +%s)" -lt "$END" ]; do
            i=$((i+1))
            echo "--- burst check $i @ $(date -u +%H:%M:%SZ) ---"
            python3 monitor.py || true
            sleep 20
          done
          echo "burst window complete after $i checks"

      - name: Persist state (only if it changed)
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "stock-monitor-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: burst-mode state update [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No state change to commit."
          fi

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TEXT="⚠️ one8 BURST mode failed
          A drop-window rapid poll errored. The regular 5-min monitor is still running, and the next hourly burst will resume.
          Logs: ${RUN_URL}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${TEXT}" >/dev/null || true
